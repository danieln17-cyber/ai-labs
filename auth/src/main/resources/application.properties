quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
%dev.auth.seed-initial-users=true
%test.auth.seed-initial-users=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${AUTH_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
smallrye.jwt.sign.key.location=${AUTH_JWT_PRIVATE_KEY_LOCATION:}
